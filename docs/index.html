<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DriveNet — V2V RC Car Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--surface:#161b22;--border:rgba(255,255,255,.07);--text:#f0f6fc;--muted:#8b949e;--dim:#6e7681;--accent:#38bdf8;--green:#10b981;--amber:#f59e0b;--rose:#f43f5e;--g1:linear-gradient(135deg,#38bdf8,#22d3ee);--g2:linear-gradient(135deg,#10b981,#22d3ee)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);padding:24px 16px;min-height:100vh;background-image:radial-gradient(ellipse 800px 400px at 15% -10%,rgba(56,189,248,.12),transparent 60%),radial-gradient(ellipse 800px 400px at 85% 110%,rgba(16,185,129,.08),transparent 60%)}
button{font:inherit}.container,.app-header{max-width:1440px;margin-left:auto;margin-right:auto}.app-header{margin-bottom:28px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:16px}.brand-mark{width:52px;height:52px;border-radius:14px;background:var(--g1);display:grid;place-items:center;font-size:26px;box-shadow:0 8px 24px rgba(56,189,248,.5)}.brand-title{font-size:1.6rem;font-weight:800}.accent{background:var(--g1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.brand-sub,.car-meta{color:var(--muted);font-size:.78rem;margin-top:5px}.live-badge{font-size:.65rem;padding:4px 10px;border-radius:6px;background:rgba(244,63,94,.12);color:#fb7185;border:1px solid rgba(244,63,94,.3);text-transform:uppercase;font-weight:700}
.cars-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-bottom:24px}.car-card,.v2v-panel{background:linear-gradient(180deg,rgba(22,27,34,.78),rgba(15,20,25,.92));border:1px solid var(--border);border-radius:20px;position:relative;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.5)}.car-card:before,.v2v-panel:before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}.car-beta:before{background:linear-gradient(90deg,transparent,var(--amber),transparent)}.car-body{padding:24px}.car-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border)}.car-avatar{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font:800 1rem 'JetBrains Mono';color:white}.car-alpha .car-avatar{background:linear-gradient(135deg,#38bdf8,#0284c7)}.car-beta .car-avatar{background:linear-gradient(135deg,#f59e0b,#d97706)}.car-name{font-weight:700}.car-meta{font: .7rem 'JetBrains Mono';color:var(--dim)}
.section-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin:12px 0;display:flex;align-items:center;gap:8px}.section-label:before{content:'';width:3px;height:12px;background:var(--g1);border-radius:2px}.sensor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.sensor-grid.cols-2{grid-template-columns:1fr 1fr}.sensor{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:12px;padding:12px}.sensor-label,.speed-label{font-size:.62rem;font-weight:600;text-transform:uppercase;color:var(--dim);margin-bottom:6px}.sensor-value{font:600 1.1rem 'JetBrains Mono';display:flex;align-items:baseline;gap:3px}.unit{font-size:.68rem;color:var(--dim)}
.speed-panel,.servo-panel{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:20px}.speed-header{display:flex;justify-content:space-between;margin-bottom:10px}.speed-readout{font:600 .85rem 'JetBrains Mono';color:var(--accent)}.speed-track{height:6px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden}.speed-progress{height:100%;width:0;background:var(--g2);transition:width .2s;box-shadow:0 0 12px rgba(16,185,129,.4)}.servo-panel{display:flex;align-items:center;gap:16px}.radar-wrap{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.15),transparent 60%),rgba(0,0,0,.3);border:1.5px solid rgba(56,189,248,.25);position:relative;flex-shrink:0}.radar-wrap:before{content:'';position:absolute;inset:12px;border-radius:50%;border:1px dashed rgba(56,189,248,.2)}.radar-beam{width:22px;height:3px;background:linear-gradient(90deg,var(--accent),transparent);position:absolute;top:50%;left:50%;transform-origin:left center;transition:transform .35s}.servo-angle{font:700 1.5rem 'JetBrains Mono'}.deg{color:var(--accent);font-size:1rem}
.controls-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ctrl-btn{padding:12px 8px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.02);color:var(--muted);font-size:.78rem;font-weight:600;cursor:pointer}.ctrl-btn:hover{color:var(--text);border-color:rgba(255,255,255,.2)}.is-fwd{color:#4ade80}.is-back{color:#60a5fa}.is-stop{color:#fbbf24}.is-brake{color:#fb7185}.active{box-shadow:0 0 24px rgba(56,189,248,.3);background:rgba(56,189,248,.2)!important;color:white!important}
.v2v-panel{padding:28px}.link-visual{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;margin-bottom:24px;padding:20px;background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:16px}.node{padding:15px 16px;border-radius:12px;background:rgba(255,255,255,.02);border:1px solid var(--border);display:flex;align-items:center;gap:14px}.link-arrows{font-size:1.3rem;color:var(--accent);animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}.neighbors-table{width:100%;border-collapse:collapse;font-size:.8rem;background:rgba(0,0,0,.2);overflow:hidden}.neighbors-table th{padding:14px 16px;text-align:left;font-size:.62rem;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);border-bottom:1px solid var(--border)}.neighbors-table td{padding:14px 16px;font: .78rem 'JetBrains Mono';border-bottom:1px solid rgba(255,255,255,.03)}.car-tag{padding:4px 9px;border-radius:6px;font-size:.68rem;font-weight:700}.alpha{background:rgba(56,189,248,.12);color:#7dd3fc}.beta{background:rgba(245,158,11,.12);color:#fbbf24}.alerts-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.alert-chip{padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.02);border:1px solid var(--border);font-size:.72rem;color:var(--dim)}.alert-chip.active{background:rgba(244,63,94,.15)!important;border-color:rgba(244,63,94,.45);color:#fb7185!important}
@media(max-width:1080px){.cars-grid{grid-template-columns:1fr}}@media(max-width:760px){.alerts-row{grid-template-columns:1fr 1fr}.link-visual{grid-template-columns:1fr}.neighbors-table{display:block;overflow-x:auto}}@media(max-width:640px){body{padding:18px 12px}.sensor-grid,.sensor-grid.cols-2{grid-template-columns:1fr}.controls-grid{grid-template-columns:repeat(2,1fr)}.car-body,.v2v-panel{padding:18px}.app-header{align-items:flex-start}.brand-sub{max-width:260px}}
</style>
</head>
<body>
<header class="app-header"><div class="brand"><div class="brand-mark">🚗</div><div><div class="brand-title">Drive<span class="accent">Net</span> <span class="live-badge">Live</span></div><div class="brand-sub">Vehicle-to-Vehicle Communication System for RC Cars</div></div></div></header>
<div class="container">
<div class="cars-grid">
<script>
const initial={1:{name:'Car Alpha',ip:'192.168.4.1',battery:92,az:1},2:{name:'Car Beta',ip:'192.168.4.2',battery:87,az:.8}};
for(const id of [1,2])document.write(`<div class="car-card car-${id===1?'alpha':'beta'}"><div class="car-body"><div class="car-header"><div style="display:flex;gap:14px;align-items:center"><div class="car-avatar">C${id}</div><div><div class="car-name">${initial[id].name}</div><div class="car-meta">${initial[id].ip} · ID: 0x0${id}</div></div></div><div class="car-meta">🔋 <strong id="c${id}-battery">${initial[id].battery}</strong>%</div></div><div class="section-label">Motion Telemetry</div><div class="sensor-grid">${[['ax','Accel X','g'],['ay','Accel Y','g'],['az','Accel Z','g'],['gx','Gyro X','°/s'],['gy','Gyro Y','°/s'],['gz','Gyro Z','°/s']].map(x=>`<div class="sensor"><div class="sensor-label">${x[1]}</div><div class="sensor-value"><span id="c${id}-${x[0]}">${x[0]==='az'?initial[id].az.toFixed(3):'0.000'}</span><span class="unit">${x[2]}</span></div></div>`).join('')}</div><div class="sensor-grid cols-2"><div class="sensor"><div class="sensor-label">Distance</div><div class="sensor-value"><span id="c${id}-dist">--</span><span class="unit">cm</span></div></div><div class="sensor"><div class="sensor-label">Updated</div><div class="sensor-value" style="font-size:.85rem"><span id="c${id}-time">--</span></div></div></div><div class="speed-panel"><div class="speed-header"><div class="speed-label">Velocity</div><div class="speed-readout"><span id="c${id}-speed-num">0</span>/255</div></div><div class="speed-track"><div class="speed-progress" id="c${id}-speed-fill"></div></div></div><div class="servo-panel"><div class="radar-wrap"><div class="radar-beam" id="c${id}-radar"></div></div><div><div class="sensor-label">Sensor Pan Angle</div><div class="servo-angle"><span id="c${id}-servo">90</span><span class="deg">°</span></div></div></div><div class="section-label">Drive Controls</div><div class="controls-grid"><button class="ctrl-btn is-back" onclick="drive(${id},'back')">◀ Back</button><button class="ctrl-btn is-fwd" onclick="drive(${id},'forward')" id="c${id}-fwd">Forward ▶</button><button class="ctrl-btn" onclick="drive(${id},'right')">Right ▶</button><button class="ctrl-btn" onclick="drive(${id},'left')">◀ Left</button><button class="ctrl-btn is-stop" onclick="drive(${id},'stop')" id="c${id}-stop">■ Stop</button><button class="ctrl-btn is-brake" onclick="brake(${id})" id="c${id}-brake">✕ Brake</button></div></div></div>`);
</script>
</div>
<div class="v2v-panel"><div class="section-label">📡 V2V Communication Link</div><div class="link-visual"><div class="node"><div style="font-size:1.5rem">🚗</div><div><div class="sensor-label">Car Alpha</div><div class="car-meta">SEQ <span id="flow-c1">0</span></div></div></div><div class="link-arrows">⇄</div><div class="node"><div style="font-size:1.5rem">🚗</div><div><div class="sensor-label">Car Beta</div><div class="car-meta">SEQ <span id="flow-c2">0</span></div></div></div></div><table class="neighbors-table"><thead><tr><th>Source</th><th>Last Seen</th><th>Speed</th><th>Distance</th><th>Accel (X,Y,Z)</th><th>Status</th></tr></thead><tbody><tr><td><span class="car-tag beta">CAR 2</span></td><td id="nb1-time">--</td><td id="nb1-speed">0%</td><td id="nb1-dist">--</td><td id="nb1-accel">0,0,1</td><td id="nb1-status">SAFE</td></tr><tr><td><span class="car-tag alpha">CAR 1</span></td><td id="nb2-time">--</td><td id="nb2-speed">0%</td><td id="nb2-dist">--</td><td id="nb2-accel">0,0,1</td><td id="nb2-status">SAFE</td></tr></tbody></table><div class="alerts-row"><div class="alert-chip" id="alert-brake">🛑 Sudden Brake</div><div class="alert-chip" id="alert-close">⚠️ Close Proximity</div><div class="alert-chip" id="alert-turn">↩️ Sharp Turn</div><div class="alert-chip" id="alert-accel">⚡ Hard Accel</div></div></div>
</div>
<script>
const MAX=255,cars={1:{speed:0,dir:0,servo:90,dist:45.3,ax:0,ay:0,az:1,gx:0,gy:0,gz:0,batt:92,seq:0,braking:false},2:{speed:0,dir:0,servo:90,dist:68.7,ax:0,ay:0,az:.8,gx:0,gy:0,gz:0,batt:87,seq:0,braking:false}};
function drive(id,cmd){const c=cars[id],p='c'+id;if(cmd==='forward'){c.dir=1;c.speed=Math.max(c.speed,1)}if(cmd==='back'){c.dir=-1;c.speed=Math.max(c.speed,1)}if(cmd==='stop'){c.dir=0;c.speed=0}if(cmd==='left')c.servo=Math.max(0,c.servo-30);if(cmd==='right')c.servo=Math.min(180,c.servo+30);['fwd','stop'].forEach(k=>document.getElementById(p+'-'+k).classList.remove('active'));if(cmd==='forward')document.getElementById(p+'-fwd').classList.add('active');if(cmd==='stop')document.getElementById(p+'-stop').classList.add('active')}
function brake(id){const c=cars[id];c.braking=true;c.dir=0;c.speed=0;document.getElementById('c'+id+'-brake').classList.add('active');setTimeout(()=>{c.braking=false;document.getElementById('c'+id+'-brake').classList.remove('active')},1500)}
function physics(){const t=Date.now();for(const id of [1,2]){const c=cars[id];if(c.dir)c.speed=Math.min(MAX,c.speed+1);else c.speed=Math.max(0,c.speed-2);const r=c.speed/MAX;c.ax+=(Math.sin(t/800+id)*.15*r-c.ax)*.15;c.ay+=(c.dir*.3*r-c.ay)*.15;c.az+=((1+(c.braking?-.8:0)+Math.sin(t/500)*.05)-c.az)*.15;c.gz+=(((c.servo-90)/90*45*r)-c.gz)*.2;c.dist=(id===1?45.3:68.7)+Math.sin(t/1200+id)*15-r*20;if(c.dist<5)c.dist=5;c.batt=Math.max(0,c.batt-r*.001);c.seq++}}
function render(){const tm=new Date().toLocaleTimeString('en-US',{hour12:false});for(const id of [1,2]){const c=cars[id],p='c'+id;for(const k of ['ax','ay','az'])document.getElementById(p+'-'+k).textContent=c[k].toFixed(3);for(const k of ['gx','gy','gz'])document.getElementById(p+'-'+k).textContent=c[k].toFixed(2);document.getElementById(p+'-dist').textContent=c.dist.toFixed(1);document.getElementById(p+'-time').textContent=tm;document.getElementById(p+'-battery').textContent=c.batt.toFixed(0);document.getElementById(p+'-speed-num').textContent=c.speed;document.getElementById(p+'-speed-fill').style.width=c.speed/MAX*100+'%';document.getElementById(p+'-servo').textContent=c.servo;document.getElementById(p+'-radar').style.transform=`translateY(-50%) rotate(${c.servo-90}deg)`}document.getElementById('flow-c1').textContent=cars[1].seq;document.getElementById('flow-c2').textContent=cars[2].seq;for(const [n,id] of [[1,2],[2,1]]){const c=cars[id];document.getElementById('nb'+n+'-time').textContent=tm;document.getElementById('nb'+n+'-speed').textContent=Math.round(c.speed/MAX*100)+'%';document.getElementById('nb'+n+'-dist').textContent=c.dist.toFixed(1)+'cm';document.getElementById('nb'+n+'-accel').textContent=`${c.ax.toFixed(2)},${c.ay.toFixed(2)},${c.az.toFixed(2)}`;document.getElementById('nb'+n+'-status').textContent=c.dist<30?'WARNING':'SAFE'}document.getElementById('alert-brake').classList.toggle('active',cars[1].braking||cars[2].braking);document.getElementById('alert-close').classList.toggle('active',cars[1].dist<30||cars[2].dist<30);document.getElementById('alert-turn').classList.toggle('active',Math.abs(cars[1].gz)>30||Math.abs(cars[2].gz)>30);document.getElementById('alert-accel').classList.toggle('active',cars[1].ay>.25||cars[2].ay>.25)}
setInterval(physics,150);setInterval(render,33);render();
</script>
</body></html>
